# Nginx configuration
# Reverse proxy на контейнер Django (localhost:32000)
#
# Установка:
# 1. Скопировать этот файл в /etc/nginx/sites-available/grapelabstd
# 2. Создать symlink: ln -s /etc/nginx/sites-available/grapelabstd /etc/nginx/sites-enabled/
# 3. Проверить конфиг: nginx -t
# 4. Перезагрузить nginx: systemctl reload nginx
# 5. Настроить SSL: certbot --nginx -d grapelabstd.ru -d www.grapelabstd.ru

upstream django_app {
    server localhost:32000;
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name grapelabstd.ru www.grapelabstd.ru;

    # Certbot для автоматического получения SSL сертификатов
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grapelabstd.ru www.grapelabstd.ru;

    # SSL сертификаты управляются certbot
    # ssl_certificate и ssl_certificate_key будут добавлены certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Логирование
    access_log /var/log/nginx/grapelabstd_access.log;
    error_log /var/log/nginx/grapelabstd_error.log warn;

    # Увеличиваем size для больших загрузок
    client_max_body_size 100M;

    # Статические файлы (CSS, JS, изображения)
    location /static/ {
        alias /opt/grapelabstd/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Пользовательские медиа-файлы
    location /media/ {
        alias /opt/grapelabstd/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Основное приложение - reverse proxy на Django
    location / {
        proxy_pass http://django_app;

        # Важные headers для Django за reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Для WebSockets (если понадобятся)
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
